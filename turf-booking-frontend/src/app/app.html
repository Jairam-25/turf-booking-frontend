@if (!hideNavbar()) {
 <app-navbar-component></app-navbar-component>
}

<main [class.has-bottom-nav]="!hideBottomNav()" class="min-h-screen relative">
 @if (isRouting()) {
 <div class="global-route-loader fixed inset-0 z-[9999] flex items-center justify-center bg-black/40 backdrop-blur-sm fade-in">
 <div class="loader-container bg-[var(--bg-card)] border border-[var(--border-color)] p-6 rounded-2xl shadow-2xl flex flex-col items-center gap-4">
 <div class="spinner-large"></div>
 <span class="text-[var(--text-primary)] font-semibold tracking-wide text-sm">{{ routingText() }}</span>
 </div>
 </div>
 }
 <router-outlet></router-outlet>
</main>

@if (!hideFooter()) {
 <app-footer-component></app-footer-component>
}

<app-toast></app-toast>
<app-chatbot></app-chatbot>
@if (!hideBottomNav()) {
 <app-bottom-nav></app-bottom-nav>
}
