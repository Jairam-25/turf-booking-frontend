
@if (showAppSplash()) {
  <div class="custom-splash-screen fixed inset-0 z-[99999] flex flex-col items-center justify-center overflow-hidden">
    <!-- Gradient Background -->
    <div class="splash-background"></div>
    
    <div class="z-10 relative flex flex-col items-center justify-center h-full w-full">
      <div class="splash-content">
        <!-- Bouncing Ball -->
        <div class="splash-ball">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/><path d="M12 6c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/></svg>
        </div>
        
        <!-- Logo -->
        <div class="splash-logo">
          TurfXpert
        </div>
        
        <!-- Tagline -->
        <div class="splash-tagline">
          Book. Play. Repeat.
        </div>
      </div>
    </div>
  </div>
}
@if (!hideNavbar()) {
 <app-navbar-component></app-navbar-component>
}

<main [class.has-bottom-nav]="!hideBottomNav()" class="min-h-screen relative">
 @if (isRouting()) {
 <div class="global-route-loader fixed inset-0 z-[9999] flex items-center justify-center bg-black/40 backdrop-blur-sm fade-in">
 <div class="loader-container bg-[var(--bg-card)] border border-[var(--border-color)] p-6 rounded-2xl shadow-2xl flex flex-col items-center gap-4">
 <div class="spinner-large"></div>
 <span class="text-[var(--text-primary)] font-semibold tracking-wide text-sm">{{ routingText() }}</span>
 </div>
 </div>
 }
 <router-outlet></router-outlet>
</main>

@if (!hideFooter()) {
 <app-footer-component></app-footer-component>
}

<app-toast></app-toast>
<app-chatbot></app-chatbot>
@if (!hideBottomNav()) {
 <app-bottom-nav></app-bottom-nav>
}
