
@if (showAppSplash()) {
  <div class="custom-splash-screen fixed inset-0 z-[99999] flex flex-col items-center justify-center bg-slate-900" style="background-color: #0f172a;">
    <div class="splash-logo-container relative mb-6">
       <!-- App icon (the one we generated) -->
       <img src="images/app-icon.jpg" alt="Logo" class="w-28 h-28 rounded-3xl shadow-[0_0_30px_rgba(123,57,252,0.4)] animate-float">
    </div>
    <div class="typing-container">
      <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-[#7b39fc] to-[#38bdf8] tracking-wider">
        TurfXpert
      </h1>
    </div>
  </div>
}
@if (!hideNavbar()) {
 <app-navbar-component></app-navbar-component>
}

<main [class.has-bottom-nav]="!hideBottomNav()" class="min-h-screen relative">
 @if (isRouting()) {
 <div class="global-route-loader fixed inset-0 z-[9999] flex items-center justify-center bg-black/40 backdrop-blur-sm fade-in">
 <div class="loader-container bg-[var(--bg-card)] border border-[var(--border-color)] p-6 rounded-2xl shadow-2xl flex flex-col items-center gap-4">
 <div class="spinner-large"></div>
 <span class="text-[var(--text-primary)] font-semibold tracking-wide text-sm">{{ routingText() }}</span>
 </div>
 </div>
 }
 <router-outlet></router-outlet>
</main>

@if (!hideFooter()) {
 <app-footer-component></app-footer-component>
}

<app-toast></app-toast>
<app-chatbot></app-chatbot>
@if (!hideBottomNav()) {
 <app-bottom-nav></app-bottom-nav>
}
