<nav class="navbar">

  <div class="logo">
    <img src="/images/logo.png" alt="Turf Booking Logo" class="nav-logo">
    <h2 class="logo-text">Turf Booking</h2>
  </div>

  <ul class="nav-links">

    <li *ngIf="isLoggedIn()">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
    </li>

    <li *ngIf="isLoggedIn()">
      <a routerLink="/bookings" routerLinkActive="active">Bookings</a>
    </li>

    <li *ngIf="isLoggedIn()">
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
    </li>


    <!-- LOGGED IN -->
    <li *ngIf="isLoggedIn()" class="user-profile">
      <span class="welcome-text">Welcome, <strong>{{ authStore.user()?.name }}</strong></span>
      <button (click)="logout()" class="nav-btn logout-btn">Logout</button>
    </li>

    <!-- Theme Toggle Switcher -->
    <li class="theme-toggle-li">
      <button (click)="toggleTheme()" class="theme-toggle-btn" aria-label="Toggle theme">
        <!-- Sun icon (for dark mode, to switch to light) -->
        <svg *ngIf="theme === 'dark'" viewBox="0 0 24 24" fill="none" class="theme-icon sun-icon" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1V3M12 21V23M4.22 4.22L5.64 5.64M18.36 18.36L19.78 19.78M1 12H3M21 12H23M4.22 19.78L5.64 18.36M18.36 5.64L19.78 4.22" stroke-linecap="round"/>
        </svg>
        <!-- Moon icon (for light mode, to switch to dark) -->
        <svg *ngIf="theme === 'light'" viewBox="0 0 24 24" fill="currentColor" class="theme-icon moon-icon">
          <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
      </button>
    </li>

  </ul>

</nav>
