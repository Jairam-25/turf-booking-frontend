<div class="min-h-screen bg-[var(--background-color)] pt-[100px] pb-10 px-4 sm:px-6 lg:px-8 xl:px-[120px] font-manrope">
  <div class="max-w-4xl mx-auto">
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-3xl font-bold text-[var(--text-primary)]">Notifications</h1>
        <p class="text-[var(--text-secondary)] mt-1">Stay updated with your bookings and alerts.</p>
      </div>
      <button *ngIf="inboxService.unreadCount() > 0" (click)="inboxService.markAllAsRead()" class="text-[#7b39fc] text-sm font-semibold hover:underline bg-[#7b39fc]/10 px-4 py-2 rounded-lg">
        Mark all as read
      </button>
    </div>

    <div class="glass rounded-2xl p-6 shadow-xl border border-white/5">
      <div *ngIf="inboxService.notifications().length === 0" class="text-center py-10">
        <div class="w-16 h-16 mx-auto bg-[var(--surface-color)] rounded-full flex items-center justify-center mb-4">
          <svg class="w-8 h-8 text-[var(--text-secondary)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
        </div>
        <h3 class="text-lg font-bold text-[var(--text-primary)] mb-2">You're all caught up!</h3>
        <p class="text-[var(--text-secondary)] max-w-md mx-auto text-sm">You have no new notifications at the moment.</p>
      </div>

      <div *ngIf="inboxService.notifications().length > 0" class="flex flex-col gap-4">
        <div *ngFor="let notif of inboxService.notifications()" 
             class="flex gap-4 p-4 rounded-xl transition-all border border-transparent"
             [ngClass]="notif.isRead ? 'bg-[var(--surface-color)]/50' : 'bg-[#7b39fc]/5 border-[#7b39fc]/20'">
          <div class="flex-shrink-0" [innerHTML]="getIcon(notif.type)"></div>
          <div class="flex-grow">
            <div class="flex items-center justify-between mb-1">
              <h4 class="font-bold text-[var(--text-primary)]" [ngClass]="{'text-[var(--text-primary)]': !notif.isRead, 'text-[var(--text-secondary)]': notif.isRead}">{{ notif.title }}</h4>
              <span class="text-xs text-[var(--text-secondary)]">{{ formatDate(notif.time) }}</span>
            </div>
            <p class="text-sm text-[var(--text-secondary)]">{{ notif.message }}</p>
          </div>
          <div *ngIf="!notif.isRead" class="flex-shrink-0 flex items-center justify-center">
            <button (click)="inboxService.markAsRead(notif.id)" class="text-xs font-semibold text-[#7b39fc] hover:underline" title="Mark as read">
              <span class="w-2.5 h-2.5 bg-[#7b39fc] rounded-full inline-block"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
