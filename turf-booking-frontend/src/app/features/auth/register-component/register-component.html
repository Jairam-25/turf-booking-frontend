<div class="auth-container">

  <h2>Register</h2>

  <form>

    <div class="form-group">
      <label>Name</label>
      <input type="text" placeholder="Enter name">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" placeholder="Enter email">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" placeholder="Enter password">
    </div>

    <button type="submit">
      Register
    </button>

  </form>

</div>
